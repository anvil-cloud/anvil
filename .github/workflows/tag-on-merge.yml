name: tag-on-merge

# Fires when a version bump (see bump-version.yml) lands on master via a
# reviewed PR merge. Detects the new version, tags it, publishes a GitHub
# Release, and dispatches release.yml to build/publish everything.
#
# Releases created by the default GITHUB_TOKEN don't cascade-trigger the
# `release: published` event (GitHub blocks that to prevent recursive runs),
# so this dispatches release.yml with `gh workflow run` instead —
# workflow_dispatch is exempt from that rule. It is dispatched rather than
# called via workflow_call because PyPI trusted publishing rejects
# attestations from reusable workflows (see the header of release.yml).
#
# NOTE: the job hard-fails if the version's tag already exists. Re-pushing an
# already-tagged version is not an expected flow (bump-version.yml always
# computes a new one).
on:
  push:
    branches: [master]
    paths:
      - provider/base-schema.json

permissions:
  contents: write
  actions: write # gh workflow run release.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and fail if already tagged
        id: check
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('provider/base-schema.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists — refusing to re-tag. Bump the version again (bump-version.yml) if you need a new release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --target master \
            --title "Anvil ${{ steps.check.outputs.tag }}" \
            --generate-notes

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --ref master \
            -f tag_name="${{ steps.check.outputs.tag }}"
