name: release

# Runs two ways:
#   1. `release: published` — someone publishes a GitHub Release by hand.
#   2. `workflow_call` — invoked directly by tag-on-merge.yml. This path exists
#      because releases created by the default GITHUB_TOKEN do NOT cascade-
#      trigger the `release: published` event (GitHub blocks that to prevent
#      recursive runs), so tag-on-merge.yml calls straight in instead.
#
# Each job below gates on `inputs.tag_name != ''` rather than
# `github.event_name == 'workflow_call'` — inside a called reusable workflow,
# github.event_name reflects the CALLER's triggering event (e.g. "push"), not
# "workflow_call". See https://github.com/orgs/community/discussions/174203
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: inputs.tag_name != '' || github.event.release.author.login == github.repository_owner || contains(fromJSON('["DamienPace15"]'), github.event.release.author.login)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

  # Publishes @anvil-cloud/sdk to npm via OIDC trusted publishing — no stored
  # token. One-time setup required on npmjs.com: package settings → Trusted
  # Publisher → GitHub Actions → this repo, workflow file "release.yml".
  # Requires npm >=11.5.1 for trusted publishing support.
  publish-npm-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: inputs.tag_name != '' || github.event.release.author.login == github.repository_owner || contains(fromJSON('["DamienPace15"]'), github.event.release.author.login)
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Install root deps (ts-node/typescript for SDK patch scripts)
        run: npm install

      - name: Upgrade npm (trusted publishing needs >=11.5.1)
        run: npm install -g npm@latest

      - name: Build nodejs SDK
        run: go run ./build build-sdk

      - name: Publish to npm
        working-directory: sdk/nodejs
        run: npm publish --access public --provenance --tag latest

  # Publishes anvil_cloud to PyPI via OIDC trusted publishing — no stored
  # token. One-time setup required on PyPI: project settings → Publishing →
  # Trusted Publisher → GitHub → this repo. PyPI matches the top-level
  # workflow, so register both "tag-on-merge.yml" (which calls this file)
  # and "release.yml" (manual release: published path).
  publish-pypi-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: inputs.tag_name != '' || github.event.release.author.login == github.repository_owner || contains(fromJSON('["DamienPace15"]'), github.event.release.author.login)
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Set up Node (for ts-node SDK patch scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Install root deps (ts-node/typescript for SDK patch scripts)
        run: npm install

      - name: Build Python SDK
        run: go run ./build build-python-sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  # "Publishes" the Go SDK the way Go modules are published: by pushing a tag
  # (sdk/go/anvil/vX.X.X) at the release commit. The generated code must
  # already be checked in and committed before cutting the release — this job
  # verifies that and fails loudly instead of silently drifting or pushing to
  # master from CI.
  publish-go-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: inputs.tag_name != '' || github.event.release.author.login == github.repository_owner || contains(fromJSON('["DamienPace15"]'), github.event.release.author.login)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Verify checked-in Go SDK is up to date
        run: |
          go run ./build gen-go-sdk
          if ! git diff --exit-code -- sdk/go/; then
            echo "::error::sdk/go/ is out of date — run 'go run ./build gen-go-sdk' and commit before releasing."
            exit 1
          fi

      - name: Tag and push Go SDK module version
        run: |
          TAG="sdk/go/anvil/${{ inputs.tag_name || github.event.release.tag_name }}"
          git tag "$TAG"
          git push origin "$TAG"
