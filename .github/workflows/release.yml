name: release

# Runs two ways:
#   1. `release: published` — someone publishes a GitHub Release by hand.
#   2. `workflow_dispatch` — triggered by tag-on-merge.yml via `gh workflow
#      run`. Releases created by the default GITHUB_TOKEN do NOT cascade-
#      trigger `release: published` (GitHub blocks that to prevent recursive
#      runs), but workflow_dispatch is exempt from that rule.
#
# This must stay a top-level workflow, not a reusable one (workflow_call):
# PyPI authenticates trusted publishing on job_workflow_ref (this file) but
# verifies attestations against the Sigstore certificate's Build Config URI,
# which is the top-level workflow. Under workflow_call those two differ and
# the upload is rejected.
#
# Dispatch is limited to github-actions[bot] (tag-on-merge.yml) and the
# maintainer, so a collaborator can't publish an arbitrary tag by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and publish (e.g. v0.1.17)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["github-actions[bot]", "DamienPace15"]'), github.actor)) || (github.event_name == 'release' && (github.event.release.author.login == github.repository_owner || github.event.release.author.login == 'DamienPace15'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

  # Publishes @anvil-cloud/sdk to npm via OIDC trusted publishing — no stored
  # token. One-time setup required on npmjs.com: package settings → Trusted
  # Publisher → GitHub Actions → this repo, workflow file "release.yml".
  # Requires npm >=11.5.1 for trusted publishing support.
  publish-npm-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["github-actions[bot]", "DamienPace15"]'), github.actor)) || (github.event_name == 'release' && (github.event.release.author.login == github.repository_owner || github.event.release.author.login == 'DamienPace15'))
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Install root deps (ts-node/typescript for SDK patch scripts)
        run: npm install

      - name: Upgrade npm (trusted publishing needs >=11.5.1)
        run: npm install -g npm@latest

      - name: Build nodejs SDK
        run: go run ./build build-sdk

      - name: Publish to npm
        working-directory: sdk/nodejs
        run: npm publish --access public --provenance --tag latest

  # Publishes anvil_cloud to PyPI via OIDC trusted publishing — no stored
  # token. One-time setup required on PyPI: project settings → Publishing →
  # Trusted Publisher → GitHub → this repo, workflow file "release.yml".
  # PyPI matches the job_workflow_ref claim (the file this job lives in),
  # so "release.yml" covers both the tag-on-merge.yml call and the manual
  # release: published path.
  publish-pypi-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["github-actions[bot]", "DamienPace15"]'), github.actor)) || (github.event_name == 'release' && (github.event.release.author.login == github.repository_owner || github.event.release.author.login == 'DamienPace15'))
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Set up Node (for ts-node SDK patch scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Install root deps (ts-node/typescript for SDK patch scripts)
        run: npm install

      - name: Build Python SDK
        run: go run ./build build-python-sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  # "Publishes" the Go SDK the way Go modules are published: by pushing a tag
  # (sdk/go/anvil/vX.X.X) at the release commit. The generated code must
  # already be checked in and committed before cutting the release — this job
  # verifies that and fails loudly instead of silently drifting or pushing to
  # master from CI.
  publish-go-sdk:
    needs: release
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["github-actions[bot]", "DamienPace15"]'), github.actor)) || (github.event_name == 'release' && (github.event.release.author.login == github.repository_owner || github.event.release.author.login == 'DamienPace15'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v2

      - name: Verify checked-in Go SDK is up to date
        run: |
          go run ./build gen-go-sdk
          if ! git diff --exit-code -- sdk/go/; then
            echo "::error::sdk/go/ is out of date — run 'go run ./build gen-go-sdk' and commit before releasing."
            exit 1
          fi

      - name: Tag and push Go SDK module version
        run: |
          TAG="sdk/go/anvil/${{ inputs.tag_name || github.event.release.tag_name }}"
          git tag "$TAG"
          git push origin "$TAG"
